<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭記帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家庭記帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --text: #18201d; --muted: #6a7570; --border: #e2e7e4;
    --accent: #0f8a66; --accent-soft: #e3f3ed; --accent-text: #ffffff;
    --pos: #0f8a66; --neg: #d64545; --warn: #e08e0b;
    --shadow: 0 1px 2px rgba(10,30,20,.05), 0 6px 20px rgba(10,30,20,.06);
    --radius: 16px; --nav-h: 62px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513; --card: #19201d; --text: #e7ecea; --muted: #93a09a; --border: #2a3430;
      --accent: #34c08f; --accent-soft: #1d3229; --accent-text: #06140e;
      --pos: #34c08f; --neg: #f06a6a; --warn: #f0b040;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { max-width: 600px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px); }

  header.top {
    position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .brand { font-weight: 750; font-size: 1.05rem; white-space: nowrap; }
  .month { display: flex; align-items: center; }
  .month .lbl { font-weight: 650; min-width: 7.6em; text-align: center; font-variant-numeric: tabular-nums; }
  .icon-btn {
    border: none; background: transparent; width: 36px; height: 36px; border-radius: 10px;
    cursor: pointer; font-size: 1.25rem; color: var(--muted); display: grid; place-items: center; flex: none;
  }
  .icon-btn:hover { background: var(--card); color: var(--text); }
  .pill { border: 1px solid var(--border); background: var(--card); border-radius: 99px; padding: 4px 12px; font-size: .8rem; cursor: pointer; }
  .pill[hidden] { display: inline-block; visibility: hidden; }

  main { padding: 2px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
  .card-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-h h2 { margin: 0; font-size: 1rem; font-weight: 650; }
  .sub { color: var(--muted); font-size: .82rem; }
  .tot { font-variant-numeric: tabular-nums; font-weight: 650; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }

  .hero .big { font-size: 2.3rem; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 0 0 12px; line-height: 1.15; }
  .stack { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--accent-soft); margin-bottom: 14px; }
  .stack span { height: 100%; transition: width .3s; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
  .kv > div { display: flex; justify-content: space-between; gap: 8px; font-size: .9rem; }
  .kv .k { color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .kv .v { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
  .note-line { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); font-size: .9rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

  .row { display: flex; gap: 8px; align-items: center; }
  .input {
    flex: 1; min-width: 0; width: 100%; border: 1px solid var(--border); background: var(--bg);
    border-radius: 12px; padding: 10px 12px; outline: none; font-size: 16px;
  }
  .input:focus { border-color: var(--accent); }
  textarea.input { resize: vertical; min-height: 84px; line-height: 1.5; }
  .btn {
    border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 10px 14px;
    cursor: pointer; font-weight: 600; white-space: nowrap; font-size: .95rem;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.danger { color: var(--neg); }
  .btn.small { padding: 6px 12px; font-size: .85rem; border-radius: 10px; }
  .btn.link { border: none; background: none; color: var(--accent); padding: 6px 2px; }
  .btn.block { width: 100%; }
  .mic { width: 46px; padding: 10px 0; font-size: 1.1rem; flex: none; }
  .mic.listening { background: var(--neg); border-color: var(--neg); color: #fff; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,69,69,.45); } 50% { box-shadow: 0 0 0 9px rgba(214,69,69,0); } }

  .seg { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 2px; }
  .seg button { border: none; background: none; padding: 4px 10px; border-radius: 8px; font-size: .8rem; cursor: pointer; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }

  .donut-wrap { display: flex; gap: 16px; align-items: center; }
  .donut { position: relative; width: 156px; flex: none; }
  .donut svg { width: 100%; display: block; }
  .donut circle.seg-c { cursor: pointer; transition: stroke-width .2s, opacity .2s; }
  .donut .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 34px; }
  .center .c1 { font-size: .75rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .center .c2 { font-weight: 750; font-size: 1.02rem; font-variant-numeric: tabular-nums; }
  .center .c3 { font-size: .72rem; color: var(--muted); }
  .legend { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .leg { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 8px; cursor: pointer; border: none; background: none; text-align: left; width: 100%; }
  .leg.dim { opacity: .4; } .leg.on { background: var(--bg); }
  .leg .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .88rem; }
  .leg .amt { font-size: .85rem; font-variant-numeric: tabular-nums; }
  .leg .pc { font-size: .75rem; color: var(--muted); width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  @media (max-width: 440px) { .donut-wrap { flex-direction: column; align-items: stretch; } .donut { margin: 0 auto; width: 178px; } }

  .trend svg { width: 100%; display: block; }
  .trend text { fill: var(--muted); font-size: 10px; }
  .trend text.cur { fill: var(--text); font-weight: 700; }
  .grid-l { stroke: var(--border); stroke-width: 1; }
  .b-in { fill: var(--accent); } .b-out { fill: var(--warn); }
  .g-hit { fill: transparent; cursor: pointer; } .g-sel { fill: var(--accent-soft); }
  .caption { font-size: .86rem; margin-top: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 32px; }

  .item { display: flex; align-items: center; gap: 12px; padding: 9px 4px; border-radius: 12px; cursor: pointer; width: 100%; border: none; background: none; text-align: left; }
  .item:hover { background: var(--bg); }
  .bubble { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 1.15rem; flex: none; }
  .item .main { flex: 1; min-width: 0; }
  .item .t { font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .a { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item-wrap { display: flex; align-items: center; gap: 4px; }
  .item-wrap .item { flex: 1; min-width: 0; }
  .paid .t { text-decoration: line-through; color: var(--muted); }
  .day-h { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); padding: 12px 4px 2px; border-top: 1px solid var(--border); margin-top: 4px; }
  .day-h:first-child { border-top: none; margin-top: 0; padding-top: 0; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin: 0 -2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--border); background: var(--card); border-radius: 99px; padding: 6px 12px; font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }

  .prog { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
  .prog > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
  .goal { padding: 14px 0; border-top: 1px solid var(--border); }
  .goal:first-child { border-top: none; padding-top: 0; }
  .goal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .goal-name { font-weight: 650; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .goal-name span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goal-meta { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); margin-top: 6px; gap: 8px; flex-wrap: wrap; }
  .goal-actions { display: flex; gap: 8px; margin-top: 10px; }
  .goal-actions .btn { flex: 1; }
  .badge { font-size: .72rem; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 99px; font-weight: 650; white-space: nowrap; }

  .empty { color: var(--muted); text-align: center; padding: 18px 8px; font-size: .9rem; }
  .hint { font-size: .84rem; color: var(--muted); margin: 0; }
  .hint b { color: var(--text); font-weight: 600; }
  ul.tips { margin: 0; padding-left: 1.2em; font-size: .88rem; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  ul.tips b { color: var(--text); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  .tabs .inner { display: flex; max-width: 600px; margin: 0 auto; }
  .tab { flex: 1; border: none; background: none; height: var(--nav-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .7rem; color: var(--muted); cursor: pointer; }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { color: var(--accent); font-weight: 650; }
  .fab {
    position: fixed; right: max(16px, calc(50% - 284px)); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
    width: 58px; height: 58px; border-radius: 18px; border: none; background: var(--accent); color: var(--accent-text);
    font-size: 2rem; line-height: 1; box-shadow: 0 8px 22px rgba(15,138,102,.35); cursor: pointer; z-index: 25; display: grid; place-items: center;
  }

  .sheet-back { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 50; display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .2s; }
  .sheet-back.open { opacity: 1; }
  .sheet {
    background: var(--card); width: 100%; max-width: 600px; max-height: 92vh; max-height: 92dvh; border-radius: 20px 20px 0 0;
    display: flex; flex-direction: column; transform: translateY(30px); transition: transform .22s ease; padding-bottom: env(safe-area-inset-bottom);
  }
  .open .sheet { transform: none; }
  @media (min-width: 640px) { .sheet-back { align-items: center; } .sheet { border-radius: 20px; } }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 4px; }
  .sheet-head h3 { margin: 0; font-size: 1.08rem; }
  .sheet-body { overflow-y: auto; padding: 8px 16px 14px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
  .sheet-foot { display: flex; gap: 8px; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
  .sheet-foot .btn { flex: 1; }
  .sheet-foot .btn.danger { flex: 0 0 auto; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .field > .lab { font-size: .82rem; color: var(--muted); font-weight: 500; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .amount-input { font-size: 1.8rem; font-weight: 700; padding: 8px 12px; font-variant-numeric: tabular-nums; }
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cat-opt { border: 1px solid var(--border); background: var(--bg); border-radius: 12px; padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .74rem; cursor: pointer; min-width: 0; }
  .cat-opt span:last-child { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .cat-opt .e { font-size: 1.25rem; }
  .cat-opt.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 650; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--card); outline: 2px solid transparent; cursor: pointer; }
  .swatch.on { outline-color: var(--text); }
  .smart { background: var(--accent-soft); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .confirm-item { border: 1px solid var(--border); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .confirm-item .full { grid-column: 1 / -1; }
  .confirm-item .ci-h { display: flex; justify-content: space-between; align-items: center; }
  .warn-t { color: var(--warn); font-size: .8rem; }
  select.input { appearance: auto; -webkit-appearance: auto; }
  .check { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; border: 2px solid var(--border); border-radius: 8px; flex: none; display: grid; place-items: center; cursor: pointer; margin: 0 4px; background: var(--card); }
  .check:checked { background: var(--accent); border-color: var(--accent); }
  .check:checked::after { content: ""; width: 6px; height: 11px; border: solid var(--accent-text); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .hist { display: flex; flex-direction: column; gap: 2px; max-height: 220px; overflow-y: auto; }
  .hist-row { display: flex; justify-content: space-between; align-items: center; font-size: .88rem; padding: 4px 0; border-bottom: 1px solid var(--border); gap: 8px; }

  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 88px); transform: translate(-50%, 10px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .9rem; opacity: 0; transition: .25s; z-index: 70; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 380px) { .kv { grid-template-columns: 1fr; } .brand { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">家庭記帳</div>
    <div class="month">
      <button class="icon-btn" id="mPrev" aria-label="上個月">‹</button>
      <span class="lbl" id="mLbl"></span>
      <button class="icon-btn" id="mNext" aria-label="下個月">›</button>
    </div>
    <button class="pill" id="mNow">回本月</button>
  </header>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="新增支出">＋</button>
<nav class="tabs"><div class="inner">
  <button class="tab" data-tab="overview"><svg viewBox="0 0 24 24"><path d="M12 3v9h9a9 9 0 1 1-9-9z"/><path d="M15.5 3.7A9 9 0 0 1 20.3 8.5H15.5z"/></svg>總覽</button>
  <button class="tab" data-tab="list"><svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>明細</button>
  <button class="tab" data-tab="budget"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 10h18M15.5 15h2.5M7 6V4.5h10V6"/></svg>收入帳單</button>
  <button class="tab" data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>儲蓄</button>
  <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>類別設定</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

      h("button", { type: "button", class: "chip" + (!ui.filterCat ? " on" : ""), text: "全部", onclick: () => { ui.filterCat = null; render(); } }),
      usedCats.map((c) => h("button", { type: "button", class: "chip" + (ui.filterCat === c.id ? " on" : ""), text: c.icon + " " + c.name, onclick: () => { ui.filterCat = c.id; render(); } })));
    const list = s.exps.filter((e) => !ui.filterCat || catById(e.categoryId).id === ui.filterCat).sort(sortExp);
    const total = sum(list.map((e) => e.amount));
    const body = [];
    if (!list.length) body.push(h("div", { class: "empty", text: "這個月還沒有支出紀錄" }));
    let curDay = null, group = null;
    list.forEach((e) => {
      if (e.date !== curDay) {
        curDay = e.date;
        const d = new Date(e.date + "T00:00:00");
        const rel = e.date === today() ? "今天・" : e.date === offsetDate(-1) ? "昨天・" : "";
        const dayTotal = sum(list.filter((x) => x.date === e.date).map((x) => x.amount));
        group = h("div", {});
        body.push(h("div", { class: "day-h" }, h("span", { text: rel + (d.getMonth() + 1) + "/" + d.getDate() + "（" + WEEK[d.getDay()] + "）" }), h("span", { text: fmt(dayTotal) })), group);
      }
      group.appendChild(expenseRow(e));
    });
    main.appendChild(h("section", { class: "card" },
      h("div", { class: "card-h" }, h("h2", { text: ui.filterCat ? catById(ui.filterCat).name + "支出" : "日常支出" }), h("span", { class: "tot", text: fmt(total) + "・" + list.length + " 筆" })),
      usedCats.length ? h("div", { style: "margin-bottom:10px" }, chips) : null, body));
    main.appendChild(h("p", { class: "hint", style: "text-align:center", text: "點任一筆可以編輯或刪除；固定帳單在「收入帳單」頁管理" }));
  }

  function renderBudget(main) {
    const s = summary(ui.month);
    const incBody = [];
    if (!s.incomes.length) {
      let pm = null;
      Object.keys(state.incomes).filter((m) => m < ui.month && state.incomes[m].length).sort().forEach((m) => { pm = m; });
      incBody.push(h("div", { class: "empty", text: "這個月還沒有收入" }));
      if (pm) incBody.push(h("button", { class: "btn block", type: "button", style: "margin-bottom:8px",
        text: "沿用 " + monthLabel(pm) + " 的收入（" + fmt(sum(state.incomes[pm].map((x) => x.amount))) + "）",
        onclick: () => { state.incomes[ui.month] = state.incomes[pm].map((x) => ({ id: uid(), name: x.name, amount: x.amount })); save(); render(); toast("已帶入收入"); } }));
    }
    s.incomes.forEach((x) => incBody.push(h("button", { class: "item", type: "button", onclick: () => incomeSheet(x) },
      h("span", { class: "bubble", style: "background:var(--accent-soft)", text: "💰" }),
      h("span", { class: "main" }, h("div", { class: "t", text: x.name })), h("span", { class: "a pos", text: fmt(x.amount) }))));
    incBody.push(h("button", { class: "btn link", type: "button", text: "＋ 新增收入", onclick: () => incomeSheet(null) }));
    main.appendChild(card("每月收入", h("span", { class: "tot pos", text: fmt(s.income) }), incBody));

    const paid = state.billPaid[ui.month] || {};
    const paidCount = s.bills.filter((b) => paid[b.id]).length;
    const bills = s.bills.slice().sort((a, b) => (a.day || 99) - (b.day || 99));
    const billBody = bills.map((b) => {
      const c = catById(b.categoryId);
      const cb = h("input", { type: "checkbox", class: "check", checked: !!paid[b.id], "aria-label": "已繳 " + b.name });
      cb.addEventListener("change", () => {
        const p = state.billPaid[ui.month] || (state.billPaid[ui.month] = {});
        if (cb.checked) p[b.id] = true; else delete p[b.id];
        save(); render();
      });
      return h("div", { class: "item-wrap" + (paid[b.id] ? " paid" : "") }, cb,
        h("button", { class: "item", type: "button", onclick: () => billSheet(b) },
          h("span", { class: "bubble", style: "background:" + tint(c.color), text: c.icon }),
          h("span", { class: "main" }, h("div", { class: "t", text: b.name }), h("div", { class: "s", text: c.name + (b.day ? "・每月 " + b.day + " 號" : "") })),
          h("span", { class: "a", text: fmt(b.amount) })));
    });
    if (!bills.length) billBody.push(h("div", { class: "empty", text: "房租、水電、保險等每月固定支出，新增一次就會每月自動計入" }));
    billBody.push(h("button", { class: "btn link", type: "button", text: "＋ 新增固定帳單", onclick: () => billSheet(null) }));
    main.appendChild(card("固定帳單", h("span", { class: "sub" }, bills.length ? "已繳 " + paidCount + "/" + bills.length + "　" : "", h("span", { class: "tot", text: fmt(s.billTotal) })), billBody));
    if (bills.length) main.appendChild(h("p", { class: "hint", style: "text-align:center", text: "勾選左邊方框標記本月已繳；點項目可編輯" }));
  }

  function renderGoals(main) {
    const s = summary(ui.month);
    const totalSaved = sum(state.goals.map(goalSaved)), totalTarget = sum(state.goals.map((g) => g.target));
    main.appendChild(h("section", { class: "card hero" },
      h("div", { class: "sub", text: "所有目標累計已存" }),
      h("div", { class: "big pos", text: fmt(totalSaved) }),
      h("div", { class: "kv" },
        h("div", {}, h("span", { class: "k", text: "目標總額" }), h("span", { class: "v", text: fmt(totalTarget) })),
        h("div", {}, h("span", { class: "k", text: "本月存入" }), h("span", { class: "v", text: fmt(s.saved) })))));
    const body = state.goals.map((g) => {
      const saved = goalSaved(g), pct = Math.min(100, Math.round(saved / g.target * 100)), left = round2(g.target - saved);
      let meta2 = null;
      if (left <= 0) meta2 = h("span", { class: "badge", text: "🎉 已達成" });
      else if (g.deadline) {
        const [ty, tm] = thisMonth().split("-").map(Number), [dy, dm] = g.deadline.split("-").map(Number);
        const months = (dy - ty) * 12 + (dm - tm) + 1;
        meta2 = h("span", { text: months > 0 ? "目標 " + dy + "/" + dm + "，每月需存 " + fmt(Math.ceil(left / months)) : "⚠️ 已過目標月份" });
      }
      return h("div", { class: "goal" },
        h("div", { class: "goal-top" }, h("span", { class: "goal-name" }, h("span", { text: g.icon }), h("span", { text: g.name })),
          h("button", { class: "icon-btn", type: "button", text: "⋯", "aria-label": "編輯目標", onclick: () => goalSheet(g) })),
        h("div", { class: "prog" }, h("div", { style: "width:" + pct + "%" })),
        h("div", { class: "goal-meta" }, h("span", {}, h("b", { style: "color:var(--text)", text: fmt(saved) }), " / " + fmt(g.target) + "（" + pct + "%）"),
          h("span", { text: left > 0 ? "還差 " + fmt(left) : "" })),
        meta2 ? h("div", { class: "goal-meta" }, meta2) : null,
        h("div", { class: "goal-actions" },
          h("button", { class: "btn primary", type: "button", text: "＋ 存入", onclick: () => depositSheet(g, false) }),
          h("button", { class: "btn", type: "button", text: "－ 取出", onclick: () => depositSheet(g, true) })));
    });
    if (!body.length) body.push(h("div", { class: "empty", text: "設定一個目標，例如「緊急預備金 10 萬」或「年底家庭旅遊」" }));
    main.appendChild(card("儲蓄目標", h("button", { class: "btn small primary", type: "button", text: "＋ 新增目標", onclick: () => goalSheet(null) }), body));
  }

  function renderSettings(main) {
    main.appendChild(card("支出類別", h("button", { class: "btn small primary", type: "button", text: "＋ 新增", onclick: () => categorySheet(null) }),
      state.categories.map((c) => h("button", { class: "item", type: "button", onclick: () => categorySheet(c) },
        h("span", { class: "bubble", style: "background:" + tint(c.color), text: c.icon }),
        h("span", { class: "main" }, h("div", { class: "t", text: c.name }), h("div", { class: "s", text: (c.keywords || []).length ? "關鍵字：" + c.keywords.slice(0, 6).join("、") + (c.keywords.length > 6 ? "…" : "") : "沒有關鍵字" })),
        h("span", { class: "dot", style: "background:" + safeColor(c.color) })))));

    main.appendChild(card("語音記帳小技巧", null, h("ul", { class: "tips" },
      h("li", {}, "說「", h("b", { text: "品項 + 金額" }), "」，例如「午餐 120」「加油 500 元」"),
      h("li", {}, "一次多筆：「", h("b", { text: "早餐 60，午餐 120，停車 40" }), "」"),
      h("li", {}, "可加日期：「", h("b", { text: "昨天買菜 350" }), "」「前天」「11 月 3 號」"),
      h("li", {}, "中文數字也可以：「兩百五」「一千二」「三萬」"),
      h("li", {}, "辨識錯的類別在確認畫面改掉，App 會", h("b", { text: "記住" }), "下次自動歸類"),
      h("li", {}, "iPhone 若 App 內 🎤 無反應，點輸入框後用", h("b", { text: "鍵盤上的麥克風" }), "說話也一樣"))));

    const installBtn = h("button", { class: "btn block primary", type: "button", text: "安裝到主畫面", onclick: () => {
      if (!installEvt) return;
      installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); });
    } });
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    main.appendChild(card("資料與隱私", null,
      h("p", { class: "hint", style: "margin-bottom:12px", text: "所有資料只儲存在這台裝置的瀏覽器中，不會上傳到任何伺服器。建議定期匯出備份。" }),
      h("div", { class: "row", style: "flex-wrap:wrap" },
        h("button", { class: "btn", type: "button", text: "匯出備份", onclick: exportData }),
        h("button", { class: "btn", type: "button", text: "匯入備份", onclick: () => $("#importFile").click() }),
        h("button", { class: "btn danger", type: "button", text: "清除所有資料", onclick: () => {
          if (!confirm("確定清除所有記帳資料？此動作無法復原。\n（建議先匯出備份）")) return;
          if (!confirm("再次確認：真的要全部清除嗎？")) return;
          state = defaults(); save(); render(); toast("已清除");
        } })),
      !standalone && installEvt ? h("div", { style: "margin-top:12px" }, installBtn) : null,
      !standalone && isIOS ? h("p", { class: "hint", style: "margin-top:12px" }, "安裝到 iPhone：用 Safari 開啟 → 點 ", h("b", { text: "分享 ⬆️" }), " → ", h("b", { text: "加入主畫面" })) : null));
  }

  function exportData() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = h("a", { href: URL.createObjectURL(blob), download: "family-budget-backup-" + today() + ".json" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("#importFile").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!s || !Array.isArray(s.categories) || !Array.isArray(s.expenses)) throw new Error("bad");
        if (!confirm("匯入會取代目前所有資料，確定繼續？")) return;
        state = normalize(s); save(); render(); toast("匯入完成");
      } catch (err) { toast("檔案格式不正確，無法匯入"); }
      finally { e.target.value = ""; }
    };
    r.readAsText(f);
  });

  // ---------- main render ----------
  function setMonth(m) { ui.month = m; ui.donutSel = null; ui.trendSel = null; render(); }
  function render() {
    $("#mLbl").textContent = monthLabel(ui.month);
    $("#mNow").hidden = ui.month === thisMonth();
    const main = $("#view"); main.innerHTML = "";
    ({ overview: renderOverview, list: renderList, budget: renderBudget, goals: renderGoals, settings: renderSettings })[ui.tab](main);
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.tab === ui.tab));
    $("#fab").style.display = ui.tab === "overview" || ui.tab === "list" ? "grid" : "none";
  }
  $("#mPrev").addEventListener("click", () => setMonth(addMonth(ui.month, -1)));
  $("#mNext").addEventListener("click", () => setMonth(addMonth(ui.month, 1)));
  $("#mNow").addEventListener("click", () => setMonth(thisMonth()));
  $("#fab").addEventListener("click", () => expenseSheet(null));
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { ui.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  // ---------- PWA ----------
  let installEvt = null;
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; if (ui.tab === "settings") render(); });
  window.addEventListener("appinstalled", () => { installEvt = null; toast("已安裝到主畫面"); });
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  let lastMonth = thisMonth();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    const now = thisMonth();
    if (now !== lastMonth) { if (ui.month === lastMonth) ui.month = now; lastMonth = now; render(); }
  });

  render();
})();
</script>
</body>
</html>
